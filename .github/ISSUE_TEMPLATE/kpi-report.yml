name: Reportar avance KPI
description: Registra avance únicamente con evidencia en un PR de código.
title: "KPI: "
labels: ["kpi-report", "kpi-pending"]
body:
  - type: markdown
    attributes:
      value: "El reporte requiere un PR fusionado con cambios y aprobación externa. En desarrollo, tu cuenta y la autoría del PR deben coincidir. Para Yestzanetli (QA comodín), una cuenta delegada publica sus casos de prueba y resultados."
  - type: dropdown
    id: member
    attributes:
      {
        label: Integrante,
        options: [Marco, América, Ricardo, Yestzanetli, Ever],
      }
    validations: { required: true }
  - type: dropdown
    id: metric
    attributes:
      {
        label: Métrica,
        options: [Avance comprometido, Calidad, QA, Entrega a producción],
      }
    validations: { required: true }
  - type: input
    id: progress
    attributes:
      { label: Avance verificable (0-100), placeholder: "Ejemplo: 25" }
    validations: { required: true }
  - type: input
    id: pr_url
    attributes:
      {
        label: URL del PR de código,
        placeholder: "https://github.com/Pigui-AI/api-pigui-backend/pull/123",
      }
    validations: { required: true }
  - type: textarea
    id: summary
    attributes:
      {
        label: Qué cambió,
        description: "Describe la entrega. Para QA incluye casos de prueba y resultados (mínimo 30 caracteres).",
      }
    validations: { required: true }
