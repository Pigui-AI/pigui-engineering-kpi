name: Sync GitHub evidence
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [kpi-pr-merged]
permissions:
  contents: write
concurrency:
  group: kpi-data-write
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect authoritative GitHub evidence
        env:
          PIGUI_READ_TOKEN: ${{ secrets.PIGUI_READ_TOKEN }}
        run: node scripts/sync-github.cjs
      - name: Validate refreshed data and assignment rules
        run: node --test tests/*.test.cjs
      - name: Publish latest dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github-audit.json
          if git diff --cached --quiet; then
            echo 'No dataset changes'
          else
            git commit -m 'chore(kpi): synchronize GitHub evidence'
            git push origin HEAD:main
          fi
