name: Verify KPI evidence
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
jobs:
  verify:
    if: contains(github.event.issue.labels.*.name, 'kpi-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: Pigui-AI/api-pigui-backend
          # For a private source repository, add PIGUI_READ_TOKEN as an Actions secret.
          PIGUI_READ_TOKEN: ${{ secrets.PIGUI_READ_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue.body || '';
            const field = (name) => (body.match(new RegExp('### ' + name + '\\s*\\n\\s*([^\\n]+)', 'i')) || [])[1]?.trim();
            const progress = Number(field('Avance verificable \\(0-100\\)'));
            const prUrl = field('URL del PR de código');
            const actor = context.payload.issue.user.login;
            const fail = async (message) => {
              await github.rest.issues.setLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,labels:['kpi-report','kpi-rejected']});
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`❌ **KPI no validado:** ${message}`});
              core.setFailed(message);
            };
            if (!Number.isFinite(progress) || progress < 0 || progress > 100) return fail('El avance debe ser un número entre 0 y 100.');
            const match = prUrl?.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)\/?$/);
            if (!match) return fail('La evidencia debe ser una URL válida de Pull Request de GitHub.');
            const [, owner, repo, number] = match;
            if (`${owner}/${repo}` !== process.env.SOURCE_REPOSITORY) return fail(`El PR debe pertenecer a ${process.env.SOURCE_REPOSITORY}.`);
            const { getOctokit } = require('@actions/github');
            const client = process.env.PIGUI_READ_TOKEN ? getOctokit(process.env.PIGUI_READ_TOKEN) : github;
            let pr;
            try { pr = (await client.rest.pulls.get({owner,repo,pull_number:Number(number)})).data; } catch { return fail('No se pudo leer el PR. Configura PIGUI_READ_TOKEN si el repo fuente es privado.'); }
            if (!pr.merged_at) return fail('El PR aún no está fusionado.');
            if (!pr.changed_files || pr.changed_files < 1) return fail('El PR no tiene cambios de código verificables.');
            if (pr.user.login.toLowerCase() !== actor.toLowerCase()) return fail(`El PR pertenece a @${pr.user.login}; el reporte debe abrirlo la misma persona.`);
            await github.rest.issues.setLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,labels:['kpi-report','kpi-verified']});
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`✅ **KPI validado.** PR #${number} está fusionado, tiene cambios y corresponde a @${actor}.`});
