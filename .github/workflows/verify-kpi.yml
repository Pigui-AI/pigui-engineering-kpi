name: Verify KPI evidence
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
  contents: write
concurrency:
  group: kpi-data-write
  cancel-in-progress: false
jobs:
  verify:
    if: contains(github.event.issue.labels.*.name, 'kpi-report') || startsWith(github.event.issue.title, 'KPI:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: Pigui-AI/api-pigui-backend
          PIGUI_READ_TOKEN: ${{ secrets.PIGUI_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { run } = require('./.github/scripts/verify-kpi.cjs');
            await run({ github, context, core });
